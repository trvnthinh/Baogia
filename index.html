                        <td className="right" style={{fontWeight:600}}>{fmt(line+vatAmt)}</td>
                      </tr>
                    );
                  })}
                  <tr className="quote-total-row">
                    <td colSpan={7} style={{textAlign:"right",fontWeight:600}}>TỔNG CỘNG:</td>
                    <td style={{textAlign:"right",fontWeight:700,color:"#1a2540",whiteSpace:"nowrap"}}>{fmt(total)}</td>
                  </tr>
                </tbody>
              </table>
            ) : (
              /* ── Bảng KHÔNG ảnh: colgroup tính chính xác, cột tên hàng tự fill ── */
              <table style={{
                width:"100%", borderCollapse:"collapse", marginBottom:12,
                fontSize:11, border:"1px solid #333", tableLayout:"fixed"
              }}>
                <colgroup>
                  <col style={{width:32}} />
                  <col />
                  <col style={{width:26}} />
                  <col style={{width:42}} />
                  <col style={{width:80}} />
                  <col style={{width:58}} />
                  <col style={{width:84}} />
                </colgroup>
                <thead>
                  <tr>
                    {[
                      ["STT","center"],
                      ["HÀNG HÓA / DỊCH VỤ","left"],
                      ["SL","center"],
                      ["ĐVT","center"],
                      ["ĐƠN GIÁ","right"],
                      ["VAT","center"],
                      ["THÀNH TIỀN","right"],
                    ].map(([label,align],idx)=>(
                      <th key={label} style={{
                        background:"transparent", color:"#1a2540", padding:"7px 4px",
                        fontWeight:600, textAlign:align,
                        borderRight: idx===6 ? "none" : "1px solid #333",
                        borderBottom:"1px solid #333",
                        overflow:"hidden", whiteSpace: label==="HÀNG HÓA / DỊCH VỤ" ? "normal" : "nowrap"
                      }}>{label}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {quote.items.map((it,i)=>{
                    const line=(it.qty||0)*(it.price||0);
                    const iRate = it.vatRate !== undefined ? it.vatRate : (quote.vatRate !== undefined ? quote.vatRate : 8);
                    const vatAmt = iRate===-1 ? 0 : Math.round(line*(iRate||0)/100);
                    const iLabel = iRate===-1 ? "KCT" : (iRate||0)+"%";
                    const td = (content, align="left", extra={}, isLast=false) => (
                      <td style={{
                        padding:"6px 5px",
                        borderRight: isLast ? "none" : "1px solid #333",
                        borderBottom:"1px solid #333", textAlign:align,
                        verticalAlign:"top", overflow:"hidden",
                        wordBreak: align==="left" ? "break-word" : "normal",
                        whiteSpace: align==="left" ? "normal" : "nowrap",
                        ...extra
                      }}>{content}</td>
                    );
                    return (
                      <tr key={it.id}>
                        {td(i+1,"center")}
                        {td(
                          <><div style={{fontWeight:500}}>{it.name}</div>
                          {it.note && <div style={{fontSize:10,color:"#888",fontStyle:"italic",marginTop:2}}>{it.note}</div>}</>,
                          "left"
                        )}
                        {td(it.qty,"center")}
                        {td(it.unit,"center")}
                        {td(fmt(it.price),"right")}
                        {td(<span style={{fontWeight:600}}>{iLabel}</span>, "center")}
                        {td(fmt(line+vatAmt),"right",{fontWeight:600},true)}
                      </tr>
                    );
                  })}
                  <tr>
                    <td colSpan={6} style={{
                      textAlign:"right", fontWeight:700, padding:"8px 5px",
                      borderRight:"1px solid #333", fontSize:12
                    }}>TỔNG CỘNG:</td>
                    <td style={{
                      textAlign:"right", fontWeight:700, color:"#1a2540",
                      padding:"8px 5px", fontSize:12, whiteSpace:"nowrap",
                      borderRight:"none"
                    }}>{fmt(total)}</td>
                  </tr>
                </tbody>
              </table>
            )}
            <div className="quote-footer">
              <div className="quote-notes">
                <ul>
                  {(quote.notes||"").split("\n").filter(l=>l.trim()).map((l,i)=><li key={i}>{l.trim()}</li>)}
                </ul>
              </div>
              <div className="quote-sign">
                <div className="location-date">Phú Mỹ, ngày {String(today.getDate()).padStart(2,"0")} tháng {String(today.getMonth()+1).padStart(2,"0")} năm {today.getFullYear()}</div>
                <div className="company-name">{COMPANY.short}</div>
              </div>
            </div>
          </div>
        </div>
        <div className="modal-footer no-print">
          <button className="btn btn-ghost" onClick={onClose}>Đóng</button>
          <button className="btn btn-excel" onClick={handleExcel}>📊 Xuất Excel</button>
          <button className="btn btn-ghost" onClick={handlePDFClick} disabled={pdfLoading} style={{minWidth:110}}>
            {pdfLoading ? "⏳ Đang tạo..." : "📄 Xuất PDF"}
          </button>
          <button className="btn btn-ghost" onClick={handleWordClick} disabled={wordLoading} style={{minWidth:110}}>
            {wordLoading ? "⏳ Đang tạo..." : "📝 Xuất Word"}
          </button>
          {onCreateContract && (
            <button className="btn btn-ghost" onClick={()=>onCreateContract(quote)}>📃 Soạn hợp đồng</button>
          )}
          {onHandover && (
            <button className="btn btn-ghost" onClick={()=>onHandover(quote)}>📋 Biên bản BG</button>
          )}
          {onDelivery && (
            <button className="btn btn-ghost" onClick={()=>onDelivery(quote)}>🚚 Phiếu giao hàng</button>
          )}
          <button className="btn btn-primary" onClick={handlePrint}>🖨️ In</button>
        </div>
      </div>
    </div>
  );
}

// ─── HandoverModal: Soạn & in biên bản bàn giao ─────────────────────────────
// Props: quote (null = tạo biên bản trắng), onClose
function HandoverModal({ quote, onClose }) {
  const today = new Date();
  const todayFull = `${String(today.getDate()).padStart(2,"0")} tháng ${String(today.getMonth()+1).padStart(2,"0")} năm ${today.getFullYear()}`;

  const [receiverName, setReceiverName] = React.useState("");
  const [receiverCompany, setReceiverCompany] = React.useState(quote ? quote.customer : "");
  const [receiverTitle, setReceiverTitle] = React.useState("");
  const [delivererName, setDelivererName] = React.useState("Trần Văn Thịnh");
  const [workContent, setWorkContent] = React.useState(quote ? (quote.workContent || "") : "");
  const [evaluation, setEvaluation] = React.useState("Tốt");
  const [dateStr, setDateStr] = React.useState(todayFull);
  const [refNum, setRefNum] = React.useState(quote ? ("BBBG-" + (quote.quoteNumber || generateId().slice(0,6).toUpperCase())) : "");
  const [pdfLoading, setPdfLoading] = React.useState(false);
  const [saving, setSaving]         = React.useState(false);
  const [saveMsg, setSaveMsg]       = React.useState("");

  // Key lưu: nếu có quote thì dùng id báo giá, nếu tạo mới độc lập thì dùng refNum
  const storageId = quote ? ("hw_" + quote.id) : null;

  // Use quote items if quote provided, else allow custom items
  const [items, setItems] = React.useState(() => {
    if (!quote) return [{ id: generateId(), name: "", qty: 1, unit: "Cái" }];
    return quote.items.map(it => ({ id: it.id, name: it.name, qty: it.qty, unit: it.unit }));
  });

  const addItem = () => setItems(prev => [...prev, { id: generateId(), name: "", qty: 1, unit: "Cái" }]);
  const removeItem = (id) => setItems(prev => prev.filter(it => it.id !== id));
  const setItemField = (id, field, val) => setItems(prev => prev.map(it => it.id === id ? { ...it, [field]: val } : it));

  // Load biên bản đã lưu trước (nếu có)
  React.useEffect(() => {
    if (!storageId) return;
    loadHandover(storageId).then(saved => {
      if (!saved) return;
      if (saved.receiverName)    setReceiverName(saved.receiverName);
      if (saved.receiverCompany) setReceiverCompany(saved.receiverCompany);
      if (saved.receiverTitle)   setReceiverTitle(saved.receiverTitle);
      if (saved.delivererName)   setDelivererName(saved.delivererName);
      if (saved.workContent)     setWorkContent(saved.workContent);
      if (saved.evaluation)      setEvaluation(saved.evaluation);
      if (saved.dateStr)         setDateStr(saved.dateStr);
      if (saved.refNum)          setRefNum(saved.refNum);
      if (saved.items && saved.items.length) setItems(saved.items);
    }).catch(() => {});
  }, []);

  const handleSave = async () => {
    if (!storageId) { showToast("⚠️ Cần gắn biên bản vào một báo giá để lưu", 2500); return; }
    setSaving(true);
    try {
      await saveHandover(storageId, { receiverName, receiverCompany, receiverTitle, delivererName, workContent, evaluation, dateStr, refNum, items });
      setSaveMsg("✓ Đã lưu");
      setTimeout(() => setSaveMsg(""), 2000);
    } finally { setSaving(false); }
  };

  const handlePrint = () => {
    const el = document.getElementById("handoverPreviewContent");
    if (!el) return;
    const iframe = document.createElement("iframe");
    iframe.style.cssText = "position:fixed;top:-9999px;left:-9999px;width:794px;height:1px;border:none;";
    document.body.appendChild(iframe);
    const iDoc = iframe.contentDocument || iframe.contentWindow.document;
    const styles = Array.from(document.querySelectorAll("style,link[rel='stylesheet']"))
      .map(s => s.outerHTML).join("\n");
    iDoc.open();
    iDoc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap">
      ${styles}
      <style>
        @page { margin:10mm; size:A4; }
        @page { margin-top:10mm; margin-bottom:10mm; }
        html { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
        body { background:#fff; margin:0; padding:0; }
        .no-print { display:none !important; }
        .handover-preview * { color:#000 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
        .handover-items-table { border:1px solid #000 !important; border-collapse:collapse !important; }
        .handover-items-table th, .handover-items-table td { border-right:1px solid #000 !important; border-bottom:1px solid #000 !important; }
        .handover-items-table th:last-child, .handover-items-table td:last-child { border-right:none !important; }
        .handover-items-table tr:last-child td { border-bottom:none !important; }
        .handover-header-table td:first-child { border-right:2px solid #000 !important; }
      </style>
    </head><body>${el.outerHTML}</body></html>`);
    iDoc.close();
    iframe.contentWindow.focus();
    setTimeout(() => {
      iframe.contentWindow.print();
      setTimeout(() => document.body.removeChild(iframe), 1000);
    }, 500);
  };

  const handlePDF = async () => {
    const el = document.getElementById("handoverPreviewContent");
    if (!el) return;
    const SCALE = 3, A4_PX = 794, PAD = 36;
    const save = { width: el.style.width, maxWidth: el.style.maxWidth, padding: el.style.padding, margin: el.style.margin, bg: el.style.background };
    el.style.width = A4_PX + "px"; el.style.maxWidth = A4_PX + "px"; el.style.padding = PAD + "px"; el.style.margin = "0"; el.style.background = "#ffffff";
    try {
      const canvas = await window.html2canvas(el, { scale: SCALE, useCORS: true, allowTaint: true, backgroundColor: "#ffffff", logging: false, width: A4_PX, height: el.scrollHeight, windowWidth: A4_PX, imageTimeout: 0 });
      const { jsPDF } = window.jspdf;
      const PAGE_W = 210, PAGE_H = 297, MARGIN = 10;
      const printW = PAGE_W - MARGIN * 2, printH = PAGE_H - MARGIN * 2;
      const realW = canvas.width / SCALE, realH = canvas.height / SCALE;
      const mmPerPx = printW / realW, pxPerPage = printH / mmPerPx;
      const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
      let srcY = 0, page = 0;
      while (srcY < realH) {
        if (page > 0) doc.addPage();
        const slicePx = Math.min(pxPerPage, realH - srcY);
        const sliceMm = slicePx * mmPerPx;
        const slice = document.createElement("canvas");
        slice.width = canvas.width; slice.height = Math.ceil(slicePx * SCALE);
        const ctx = slice.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, slice.width, slice.height);
        ctx.drawImage(canvas, 0, Math.floor(srcY * SCALE), canvas.width, Math.ceil(slicePx * SCALE), 0, 0, slice.width, slice.height);
        doc.addImage(slice.toDataURL("image/jpeg", 0.92), "JPEG", MARGIN, MARGIN, printW, sliceMm);
        srcY += slicePx; page++;
      }
      doc.save("BienBan_" + refNum + ".pdf");
    } finally {
      el.style.width = save.width; el.style.maxWidth = save.maxWidth; el.style.padding = save.padding; el.style.margin = save.margin; el.style.background = save.bg;
    }
  };

  const handlePDFClick = async () => { setPdfLoading(true); try { await handlePDF(); } finally { setPdfLoading(false); } };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: 980 }}>
        <div className="modal-header no-print">
          <span className="modal-title">📋 Biên bản bàn giao & nghiệm thu</span>
          <button className="close-btn" onClick={onClose}>×</button>
        </div>
        <div className="modal-body" style={{ display: "flex", gap: 20 }}>
          {/* Left: Form */}
          <div className="no-print" style={{ width: 320, flexShrink: 0, borderRight: "1px solid #e5e3dc", paddingRight: 20 }}>
            <div className="hw-form-section">
              <h4>Thông tin biên bản</h4>
              <div className="form-group">
                <label>Số biên bản</label>
                <input className="form-control" value={refNum} onChange={e => setRefNum(e.target.value)} />
              </div>
              <div className="form-group">
                <label>Ngày lập</label>
                <input className="form-control" value={dateStr} onChange={e => setDateStr(e.target.value)} />
              </div>
            </div>
            <div className="hw-form-section">
              <h4>Bên giao</h4>
              <div className="form-group">
                <label>Người đại diện</label>
                <input className="form-control" value={delivererName} onChange={e => setDelivererName(e.target.value)} />
              </div>
            </div>
            <div className="hw-form-section">
              <h4>Bên nhận</h4>
              <div className="form-group">
                <label>Ông/Bà</label>
                <input className="form-control" placeholder="Họ tên người nhận" value={receiverName} onChange={e => setReceiverName(e.target.value)} />
              </div>
              <div className="form-group">
                <label>Chức vụ</label>
                <input className="form-control" placeholder="Chức vụ (nếu có)" value={receiverTitle} onChange={e => setReceiverTitle(e.target.value)} />
              </div>
              <div className="form-group">
                <label>Đại diện đơn vị</label>
                <input className="form-control" value={receiverCompany} onChange={e => setReceiverCompany(e.target.value)} />
              </div>
            </div>
            <div className="hw-form-section">
              <h4>Nội dung công việc</h4>
              <div className="form-group">
                <textarea className="form-control" rows={3} placeholder="Mô tả nội dung công việc..." value={workContent} onChange={e => setWorkContent(e.target.value)} />
              </div>
            </div>
            <div className="hw-form-section">
              <h4>Danh mục thiết bị & dịch vụ</h4>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                <thead>
                  <tr>
                    <th style={{ textAlign: "left", padding: "4px 4px", fontWeight: 600, color: "#666", borderBottom: "1px solid #e5e3dc" }}>Tên hàng hóa</th>
                    <th style={{ width: 45, textAlign: "center", padding: "4px", borderBottom: "1px solid #e5e3dc", fontWeight: 600, color: "#666" }}>SL</th>
                    <th style={{ width: 50, textAlign: "center", padding: "4px", borderBottom: "1px solid #e5e3dc", fontWeight: 600, color: "#666" }}>ĐVT</th>
                    <th style={{ width: 24, borderBottom: "1px solid #e5e3dc" }}></th>
                  </tr>
                </thead>
                <tbody>
                  {items.map((it, i) => (
                    <tr key={it.id}>
                      <td style={{ padding: "3px 4px" }}>
                        <input style={{ width: "100%", border: "1px solid #d1cfc6", borderRadius: 4, padding: "3px 5px", fontSize: 12, fontFamily: "inherit" }}
                          value={it.name} onChange={e => setItemField(it.id, "name", e.target.value)} placeholder={`Hàng hóa ${i + 1}`} />
                      </td>
                      <td style={{ padding: "3px 4px" }}>
                        <input type="number" style={{ width: "100%", border: "1px solid #d1cfc6", borderRadius: 4, padding: "3px 5px", fontSize: 12, textAlign: "center", fontFamily: "inherit" }}
                          value={it.qty} onChange={e => setItemField(it.id, "qty", e.target.value)} />
                      </td>
                      <td style={{ padding: "3px 4px" }}>
                        <input style={{ width: "100%", border: "1px solid #d1cfc6", borderRadius: 4, padding: "3px 5px", fontSize: 12, fontFamily: "inherit" }}
                          value={it.unit} onChange={e => setItemField(it.id, "unit", e.target.value)} />
                      </td>
                      <td style={{ textAlign: "center", padding: "3px 2px" }}>
                        {items.length > 1 && (
                          <button onClick={() => removeItem(it.id)} style={{ background: "none", border: "none", color: "#dc2626", cursor: "pointer", fontSize: 14, lineHeight: 1, padding: "2px" }}>×</button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <button className="btn btn-ghost btn-sm" style={{ marginTop: 8 }} onClick={addItem}>+ Thêm dòng</button>
            </div>
            <div className="hw-form-section">
              <h4>Đánh giá nghiệm thu</h4>
              <div className="form-group">
                <select className="form-control" value={evaluation} onChange={e => setEvaluation(e.target.value)}>
                  <option>Tốt</option>
                  <option>Đạt yêu cầu</option>
                  <option>Khá</option>
                  <option>Cần cải thiện</option>
                </select>
              </div>
            </div>
          </div>

          {/* Right: Preview */}
          <div style={{ flex: 1, overflowY: "auto" }}>
            <div className="handover-preview" id="handoverPreviewContent">
              {/* Header */}
              <table className="handover-header-table">
                <tbody>
                  <tr>
                    <td>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <img src={LOGO_DATA_URL} style={{ width: 50, height: 50, objectFit: "contain" }} alt="PMC" />
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 13 }}>{COMPANY.name}</div>
                          <div style={{ fontSize: 10, color: "#555" }}>Địa chỉ: {COMPANY.address}</div>
                          <div style={{ fontSize: 10, color: "#555" }}>ĐT: {COMPANY.phone} | Email: {COMPANY.email}</div>
                        </div>
                      </div>
                    </td>
                    <td>
                      <div style={{ fontWeight: 700, fontSize: 12 }}>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</div>
                      <div style={{ fontWeight: 600, fontSize: 12 }}>Độc lập – Tự do – Hạnh phúc</div>
                      <div style={{ fontSize: 11, marginTop: 4 }}>⸻⸻⸻</div>
                    </td>
                  </tr>
                </tbody>
              </table>

              {/* Title */}
              <div className="handover-title">
                <h1>Biên bản nghiệm thu và bàn giao thiết bị</h1>
                {refNum && <div className="ref">Số: {refNum}</div>}
              </div>

              {/* Body */}
              <div className="handover-body">
                <p>Hôm nay, ngày <strong>{dateStr}</strong>, chúng tôi gồm có:</p>

                <p><strong>BÊN GIAO:</strong></p>
                <p style={{ marginLeft: 20 }}>Ông: <strong>{delivererName || "……………………………"}</strong></p>
                <p style={{ marginLeft: 20 }}>Đại diện: <strong>{COMPANY.name}</strong></p>

                <p style={{ marginTop: 10 }}><strong>BÊN NHẬN:</strong></p>
                <p style={{ marginLeft: 20 }}>Ông/Bà: <strong>{receiverName || "……………………………………"}</strong>{receiverTitle ? ` – ${receiverTitle}` : ""}</p>
                <p style={{ marginLeft: 20 }}>Đại diện: <strong>{receiverCompany || "……………………………………………………………"}</strong></p>

                {workContent && (
                  <p style={{ marginTop: 10 }}>– Nội dung công việc: {workContent}</p>
                )}

                <p style={{ marginTop: 10 }}>– Thiết bị &amp; dịch vụ gồm có:</p>

                <table className="handover-items-table">
                  <thead>
                    <tr>
                      <th style={{ width: 36 }}>STT</th>
                      <th style={{ textAlign: "left" }}>HÀNG HÓA / DỊCH VỤ</th>
                      <th style={{ width: 55 }}>SỐ LƯỢNG</th>
                      <th style={{ width: 60 }}>ĐVT</th>
                    </tr>
                  </thead>
                  <tbody>
                    {items.map((it, i) => (
                      <tr key={it.id}>
                        <td style={{ textAlign: "center" }}>{i + 1}</td>
                        <td>{it.name}</td>
                        <td style={{ textAlign: "center" }}>{it.qty}</td>
                        <td style={{ textAlign: "center" }}>{it.unit}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                <p>– Đánh giá: <strong>{evaluation}</strong>.</p>

                <p style={{ marginTop: 12 }}>
                  Hai bên thống nhất lập Biên bản bàn giao và nghiệm thu theo những nội dung như trên và được lập thành 02 bản giống nhau, mỗi bên giữ một bản có giá trị tương đương nhau.
                </p>
              </div>

              {/* Signatures */}
              <div className="handover-sign">
                <div className="handover-sign-block">
                  <div className="sign-title">BÊN GIAO</div>
                  <div className="sign-name">(Ký và ghi rõ họ tên)</div>
                  <div className="sign-space" />
                  <div style={{ fontWeight: 600 }}>{delivererName}</div>
                  <div className="sign-name">{COMPANY.short}</div>
                </div>
                <div className="handover-sign-block">
                  <div className="sign-title">BÊN NHẬN</div>
                  <div className="sign-name">(Ký và ghi rõ họ tên)</div>
                  <div className="sign-space" />
                  {/* Tên: nếu chưa điền → gạch dưới để ký tay */}
                  <div style={{ fontWeight:600, borderBottom: receiverName ? "none" : "1px solid #333", minWidth:160, display:"inline-block", minHeight:18 }}>
                    {receiverName || ""}
                  </div>
                  <div className="sign-name" style={{ marginTop:3 }}>
                    {receiverCompany || ""}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div className="modal-footer no-print">
          <button className="btn btn-ghost" onClick={onClose}>Đóng</button>
          {storageId && (
            <button className="btn btn-ghost" onClick={handleSave} disabled={saving}>
              {saving ? "⏳ Đang lưu..." : "💾 Lưu biên bản"}{saveMsg && <span style={{color:"#16a34a",marginLeft:6}}>{saveMsg}</span>}
            </button>
          )}
          <button className="btn btn-ghost" onClick={handlePDFClick} disabled={pdfLoading} style={{ minWidth: 110 }}>
            {pdfLoading ? "⏳ Đang tạo..." : "📄 Xuất PDF"}
          </button>
          <button className="btn btn-primary" onClick={handlePrint}>🖨️ In</button>
        </div>
      </div>
    </div>
  );
}

// ─── DeliveryModal: Soạn & in phiếu giao hàng ───────────────────────────────
// Props: quote (null = phiếu trắng), onClose
function DeliveryModal({ quote, onClose }) {
  const today = new Date();
  const todayFull = `ngày ${String(today.getDate()).padStart(2,"0")} tháng ${String(today.getMonth()+1).padStart(2,"0")} năm ${today.getFullYear()}`;

  const [refNum,        setRefNum]        = React.useState(() => "PGH-" + (quote?.quoteNumber || generateId().slice(0,6).toUpperCase()));
  const [dateStr,       setDateStr]       = React.useState(todayFull);
  const [delivererName, setDelivererName] = React.useState("Trần Văn Thịnh");
  const [delivererPhone,setDelivererPhone]= React.useState(COMPANY.phone);
  const [receiverName,  setReceiverName]  = React.useState("");
  const [receiverPhone, setReceiverPhone] = React.useState(quote?.phone || "");
  const [receiverCompany,setReceiverCompany]=React.useState(quote?.customer || "");
  const [deliveryAddress,setDeliveryAddress]=React.useState(quote?.address || "");
  const [note,          setNote]          = React.useState("");
  const [pdfLoading,    setPdfLoading]    = React.useState(false);
  const [saving,        setSaving]        = React.useState(false);
  const [saveMsg,       setSaveMsg]       = React.useState("");

  const storageId = quote ? ("dv_" + quote.id) : null;

  // Load phiếu đã lưu trước (nếu có)
  React.useEffect(() => {
    if (!storageId) return;
    loadDelivery(storageId).then(saved => {
      if (!saved) return;
      if (saved.refNum)          setRefNum(saved.refNum);
      if (saved.dateStr)         setDateStr(saved.dateStr);
      if (saved.delivererName)   setDelivererName(saved.delivererName);
      if (saved.delivererPhone)  setDelivererPhone(saved.delivererPhone);
      if (saved.receiverName)    setReceiverName(saved.receiverName);
      if (saved.receiverPhone)   setReceiverPhone(saved.receiverPhone);
      if (saved.receiverCompany) setReceiverCompany(saved.receiverCompany);
      if (saved.deliveryAddress) setDeliveryAddress(saved.deliveryAddress);
      if (saved.note)            setNote(saved.note);
      if (saved.items && saved.items.length) setItems(saved.items);
    }).catch(() => {});
  }, []);

  const handleSave = async () => {
    if (!storageId) { showToast("⚠️ Cần gắn phiếu vào một báo giá để lưu", 2500); return; }
    setSaving(true);
    try {
      await saveDelivery(storageId, { refNum, dateStr, delivererName, delivererPhone, receiverName, receiverPhone, receiverCompany, deliveryAddress, note, items });
      setSaveMsg("✓ Đã lưu");
      setTimeout(() => setSaveMsg(""), 2000);
    } finally { setSaving(false); }
  };

  // Bảng hàng hóa – lấy từ báo giá nếu có, thêm cột serial
  const [items, setItems] = React.useState(() => {
    if (!quote) return [{ id: generateId(), name: "", qty: 1, unit: "Cái", serial: "" }];
    return quote.items.map(it => ({ id: it.id, name: it.name, qty: it.qty, unit: it.unit, serial: "" }));
  });

  const addItem    = () => setItems(p => [...p, { id: generateId(), name: "", qty: 1, unit: "Cái", serial: "" }]);
  const removeItem = id  => setItems(p => p.filter(it => it.id !== id));
  const setField   = (id, f, v) => setItems(p => p.map(it => it.id === id ? { ...it, [f]: v } : it));

  // ── In / PDF (dùng lại pattern HandoverModal) ────────────────────────────
  const handlePrint = () => {
    const el = document.getElementById("deliveryPreviewContent");
    if (!el) return;
    const iframe = document.createElement("iframe");
    iframe.style.cssText = "position:fixed;top:-9999px;left:-9999px;width:794px;height:1px;border:none;";
    document.body.appendChild(iframe);
    const iDoc = iframe.contentDocument || iframe.contentWindow.document;
    const styles = Array.from(document.querySelectorAll("style,link[rel='stylesheet']")).map(s => s.outerHTML).join("\n");
    iDoc.open();
    iDoc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap">
      ${styles}
      <style>
        @page { margin:10mm; size:A4; }
        html { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
        body { background:#fff; margin:0; padding:0; }
        .no-print { display:none !important; }
        .handover-items-table { border:1px solid #000 !important; border-collapse:collapse !important; }
        .handover-items-table th, .handover-items-table td { border-right:1px solid #000 !important; border-bottom:1px solid #000 !important; color:#000 !important; }
        .handover-items-table th:last-child, .handover-items-table td:last-child { border-right:none !important; }
        .handover-items-table tr:last-child td { border-bottom:none !important; }
      </style>
    </head><body>${el.outerHTML}</body></html>`);
    iDoc.close();
    iframe.contentWindow.focus();
    setTimeout(() => { iframe.contentWindow.print(); setTimeout(() => document.body.removeChild(iframe), 1000); }, 500);
  };

  const handlePDF = async () => {
    const el = document.getElementById("deliveryPreviewContent");
    if (!el) return;
    const SCALE = 3, A4_PX = 794, PAD = 36;
    const save = { width: el.style.width, maxWidth: el.style.maxWidth, padding: el.style.padding, margin: el.style.margin, bg: el.style.background };
    el.style.width = A4_PX + "px"; el.style.maxWidth = A4_PX + "px";
    el.style.padding = PAD + "px"; el.style.margin = "0"; el.style.background = "#ffffff";
    try {
      const canvas = await window.html2canvas(el, { scale: SCALE, useCORS: true, allowTaint: true, backgroundColor: "#ffffff", logging: false, width: A4_PX, height: el.scrollHeight, windowWidth: A4_PX, imageTimeout: 0 });
      const { jsPDF } = window.jspdf;
      const PAGE_W = 210, PAGE_H = 297, MARGIN = 10;
      const printW = PAGE_W - MARGIN * 2, printH = PAGE_H - MARGIN * 2;
      const realW = canvas.width / SCALE, realH = canvas.height / SCALE;
      const mmPerPx = printW / realW, pxPerPage = printH / mmPerPx;
      const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
      let srcY = 0, page = 0;
      while (srcY < realH) {
        if (page > 0) doc.addPage();
        const slicePx = Math.min(pxPerPage, realH - srcY), sliceMm = slicePx * mmPerPx;
        const slice = document.createElement("canvas");
        slice.width = canvas.width; slice.height = Math.ceil(slicePx * SCALE);
        const ctx = slice.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, slice.width, slice.height);
        ctx.drawImage(canvas, 0, Math.floor(srcY * SCALE), canvas.width, Math.ceil(slicePx * SCALE), 0, 0, slice.width, slice.height);
        doc.addImage(slice.toDataURL("image/jpeg", 0.92), "JPEG", MARGIN, MARGIN, printW, sliceMm);
        srcY += slicePx; page++;
      }
      doc.save("PhieuGiaoHang_" + refNum + ".pdf");
    } finally {
      el.style.width = save.width; el.style.maxWidth = save.maxWidth;
      el.style.padding = save.padding; el.style.margin = save.margin; el.style.background = save.bg;
    }
  };

  const handlePDFClick = async () => { setPdfLoading(true); try { await handlePDF(); } finally { setPdfLoading(false); } };

  // ── Render ────────────────────────────────────────────────────────────────
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: 1000 }}>
        <div className="modal-header no-print">
          <span className="modal-title">🚚 Phiếu giao hàng</span>
          <button className="close-btn" onClick={onClose}>×</button>
        </div>

        <div className="modal-body" style={{ display: "flex", gap: 20 }}>

          {/* ── Cột trái: Form nhập ── */}
          <div className="no-print" style={{ width: 300, flexShrink: 0, borderRight: "1px solid #e5e3dc", paddingRight: 20, overflowY: "auto" }}>

            <div className="hw-form-section">
              <h4>Thông tin phiếu</h4>
              <div className="form-group">
                <label>Số phiếu</label>
                <input className="form-control" value={refNum} onChange={e => setRefNum(e.target.value)} />
              </div>
              <div className="form-group">
                <label>Ngày lập</label>
                <input className="form-control" value={dateStr} onChange={e => setDateStr(e.target.value)} />
              </div>
            </div>

            <div className="hw-form-section">
              <h4>Bên giao</h4>
              <div className="form-group">
                <label>Người giao hàng</label>
                <input className="form-control" value={delivererName} onChange={e => setDelivererName(e.target.value)} />
              </div>
              <div className="form-group">
                <label>Điện thoại</label>
                <input className="form-control" value={delivererPhone} onChange={e => setDelivererPhone(e.target.value)} />
              </div>
            </div>

            <div className="hw-form-section">
              <h4>Bên nhận</h4>
              <div className="form-group">
                <label>Người nhận</label>
                <input className="form-control" placeholder="Họ tên người nhận" value={receiverName} onChange={e => setReceiverName(e.target.value)} />
              </div>
              <div className="form-group">
                <label>Điện thoại</label>
                <input className="form-control" value={receiverPhone} onChange={e => setReceiverPhone(e.target.value)} />
              </div>
              <div className="form-group">
                <label>Công ty / Đơn vị</label>
                <input className="form-control" value={receiverCompany} onChange={e => setReceiverCompany(e.target.value)} />
              </div>
              <div className="form-group">
                <label>Địa chỉ giao hàng</label>
                <textarea className="form-control" rows={2} value={deliveryAddress} onChange={e => setDeliveryAddress(e.target.value)} />
              </div>
            </div>

            <div className="hw-form-section">
              <h4>Danh sách hàng hóa</h4>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11 }}>
                <thead>
                  <tr>
                    <th style={{ textAlign:"left", padding:"3px 3px", fontWeight:600, color:"#666", borderBottom:"1px solid #e5e3dc" }}>Tên hàng</th>
                    <th style={{ width:36, textAlign:"center", padding:"3px", borderBottom:"1px solid #e5e3dc", fontWeight:600, color:"#666" }}>SL</th>
                    <th style={{ width:42, textAlign:"center", padding:"3px", borderBottom:"1px solid #e5e3dc", fontWeight:600, color:"#666" }}>ĐVT</th>
                    <th style={{ width:70, textAlign:"center", padding:"3px", borderBottom:"1px solid #e5e3dc", fontWeight:600, color:"#666" }}>Serial/SN</th>
                    <th style={{ width:20, borderBottom:"1px solid #e5e3dc" }}></th>
                  </tr>
                </thead>
                <tbody>
                  {items.map((it, i) => (
                    <tr key={it.id}>
                      <td style={{ padding:"2px 3px" }}>
                        <input style={{ width:"100%", border:"1px solid #d1cfc6", borderRadius:3, padding:"2px 4px", fontSize:11, fontFamily:"inherit" }}
                          value={it.name} onChange={e => setField(it.id, "name", e.target.value)} placeholder={`Hàng ${i+1}`} />
                      </td>
                      <td style={{ padding:"2px 3px" }}>
                        <input type="number" style={{ width:"100%", border:"1px solid #d1cfc6", borderRadius:3, padding:"2px 3px", fontSize:11, textAlign:"center", fontFamily:"inherit" }}
                          value={it.qty} onChange={e => setField(it.id, "qty", e.target.value)} />
                      </td>
                      <td style={{ padding:"2px 3px" }}>
                        <input style={{ width:"100%", border:"1px solid #d1cfc6", borderRadius:3, padding:"2px 3px", fontSize:11, fontFamily:"inherit" }}
                          value={it.unit} onChange={e => setField(it.id, "unit", e.target.value)} />
                      </td>
                      <td style={{ padding:"2px 3px" }}>
                        <input style={{ width:"100%", border:"1px solid #d1cfc6", borderRadius:3, padding:"2px 3px", fontSize:11, fontFamily:"inherit" }}
                          value={it.serial} onChange={e => setField(it.id, "serial", e.target.value)} placeholder="…" />
                      </td>
                      <td style={{ textAlign:"center", padding:"2px 1px" }}>
                        {items.length > 1 && (
                          <button onClick={() => removeItem(it.id)} style={{ background:"none", border:"none", color:"#dc2626", cursor:"pointer", fontSize:14, padding:"1px" }}>×</button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <button className="btn btn-ghost btn-sm" style={{ marginTop:8 }} onClick={addItem}>+ Thêm dòng</button>
            </div>

            <div className="hw-form-section">
              <h4>Ghi chú</h4>
              <div className="form-group">
                <textarea className="form-control" rows={2} placeholder="Ghi chú thêm (nếu có)..." value={note} onChange={e => setNote(e.target.value)} />
              </div>
            </div>

          </div>

          {/* ── Cột phải: Preview ── */}
          <div style={{ flex:1, overflowY:"auto" }}>
            <div id="deliveryPreviewContent" style={{ fontFamily:"'Be Vietnam Pro',sans-serif", padding:28, maxWidth:794, margin:"0 auto", background:"#fff", fontSize:13, color:"#000" }}>

              {/* Header: logo + quốc hiệu */}
              <table style={{ width:"100%", borderCollapse:"collapse", marginBottom:14 }}>
                <tbody>
                  <tr>
                    <td style={{ width:"55%", verticalAlign:"top", paddingRight:12, borderRight:"2px solid #1a2540" }}>
                      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                        <img src={LOGO_DATA_URL} style={{ width:48, height:48, objectFit:"contain" }} alt="PMC" />

                    </td>
                    <td style={{ textAlign:"center", paddingLeft:12, verticalAlign:"top" }}>

                      <div style={{ fontWeight:600, fontSize:12 }}>Độc lập – Tự do – Hạnh phúc</div>
                      <div style={{ fontSize:11, marginTop:4 }}>⸻⸻⸻</div>

                </tbody>
              </table>

              {/* Tiêu đề */}
              <div style={{ textAlign:"center", margin:"14px 0 18px" }}>
                <div style={{ fontSize:18, fontWeight:700, color:"#1a2540", textTransform:"uppercase", letterSpacing:"0.05em" }}>Phiếu giao hàng</div>
                <div style={{ fontSize:11, color:"#666", marginTop:3 }}>Số: <strong>{refNum}</strong></div>
                <div style={{ fontSize:11, color:"#666" }}>{dateStr}</div>
              </div>

              {/* Thông tin bên giao / bên nhận */}
              <table style={{ width:"100%", borderCollapse:"collapse", marginBottom:14, fontSize:12 }}>
                <tbody>
                  <tr>
                    <td style={{ width:"50%", verticalAlign:"top", paddingRight:16 }}>
                      <div style={{ fontWeight:700, color:"#1a2540", marginBottom:6, fontSize:12, borderBottom:"1px solid #e5e3dc", paddingBottom:4 }}>BÊN GIAO HÀNG</div>
                      <div><span style={{ color:"#555", minWidth:90, display:"inline-block" }}>Công ty:</span> <strong>{COMPANY.name}</strong></div>
                      <div><span style={{ color:"#555", minWidth:90, display:"inline-block" }}>Người giao:</span> <strong>{delivererName || "……………………………"}</strong></div>

              <table className="handover-items-table" style={{ marginBottom:14 }}>

                  <tr>
                    <th style={{ width:36 }}>STT</th>
                    <th style={{ textAlign:"left" }}>TÊN HÀNG HÓA / DỊCH VỤ</th>

                    <th style={{ width:55 }}>ĐVT</th>

              </table>

              {/* Ghi chú */}
              {note && (
                <div style={{ marginBottom:16, fontSize:12, color:"#444" }}>
                  <strong>Ghi chú:</strong> {note}
                </div>
              )}

              {/* Xác nhận giao nhận */}
              <div style={{ marginBottom:16, fontSize:12, lineHeight:1.8 }}>
                Hai bên xác nhận hàng hóa giao nhận đúng số lượng, chủng loại và tình trạng như trên. Phiếu giao hàng được lập thành <strong>02 bản</strong>, mỗi bên giữ <strong>01 bản</strong> có giá trị như nhau.
              </div>

              {/* Chữ ký */}
              <div style={{ display:"flex", justifyContent:"space-between", marginTop:24, fontSize:12 }}>
                <div style={{ textAlign:"center", minWidth:200 }}>
                  <div style={{ fontWeight:700, color:"#1a2540", marginBottom:2 }}>NGƯỜI GIAO HÀNG</div>
                  <div style={{ color:"#666", fontSize:11 }}>(Ký và ghi rõ họ tên)</div>
                  <div style={{ height:60 }} />
                  <div style={{ fontWeight:600 }}>{delivererName}</div>
                  <div style={{ color:"#666", fontSize:11 }}>{COMPANY.short}</div>
                </div>
                <div style={{ textAlign:"center", minWidth:200 }}>
                  <div style={{ fontWeight:700, color:"#1a2540", marginBottom:2 }}>NGƯỜI NHẬN HÀNG</div>
                  <div style={{ color:"#666", fontSize:11 }}>(Ký và ghi rõ họ tên)</div>
                  <div style={{ height:60 }} />
                  {/* Tên: nếu chưa điền → gạch dưới để ký tay */}
                  <div style={{ fontWeight:600, borderBottom: receiverName ? "none" : "1px solid #333", minWidth:160, display:"inline-block", minHeight:18 }}>
                    {receiverName || ""}
                  </div>
                  {/* Công ty: luôn hiển thị bên dưới, nếu chưa có thì để trống */}
                  <div style={{ color:"#666", fontSize:11, marginTop:3 }}>
                    {receiverCompany || ""}
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>

        <div className="modal-footer no-print">
          <button className="btn btn-ghost" onClick={onClose}>Đóng</button>
          {storageId && (
            <button className="btn btn-ghost" onClick={handleSave} disabled={saving}>
              {saving ? "⏳ Đang lưu..." : "💾 Lưu phiếu"}{saveMsg && <span style={{color:"#16a34a",marginLeft:6}}>{saveMsg}</span>}
            </button>
          )}
          <button className="btn btn-ghost" onClick={handlePDFClick} disabled={pdfLoading} style={{ minWidth:110 }}>
            {pdfLoading ? "⏳ Đang tạo..." : "📄 Xuất PDF"}
          </button>
          <button className="btn btn-primary" onClick={handlePrint}>🖨️ In</button>
        </div>
      </div>
    </div>
  );
}

    const fieldsToTranslate = {
      buyerNameEn:      form.buyerName,
      buyerRepEn:       form.buyerRep,
      buyerPositionEn:  form.buyerPosition,
      buyerAddressEn:   form.buyerAddress,
      buyerBankEn:      form.buyerBank,
      deliveryPlaceEn:  form.deliveryPlace,
      [lang==="vi_en"?"paymentTermEn":"paymentTermZh"]: form.paymentTerm,
    };
    const viText = Object.entries(fieldsToTranslate)
      .filter(([,v]) => v && v.trim())
      .map(([k,v]) => `[${k}]: ${v}`)
      .join("\n");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: `You are a professional Vietnamese-to-${targetLang} translator for legal/commercial documents. Translate ONLY the values, keep the [key] labels exactly. Return ONLY JSON object mapping keys to translated strings, no markdown.`,
          messages: [{ role: "user", content: `Translate these Vietnamese values to ${targetLang}:\n${viText}` }],
        }),
      });
      const data = await res.json();
      const text = (data.content || []).map(c => c.text||"").join("");
      const clean = text.replace(/```json|```/g,"").trim();
      const translated = JSON.parse(clean);
      setForm(p => ({ ...p, ...translated }));

        ...bi(T.art3_1(form.deliveryDays), T.art3_1B(form.deliveryDays), { spaceAfter: 2 }),
        ...bi(T.art3_2(form.deliveryPlace), T.art3_2B(form.deliveryPlaceEn || form.deliveryPlace), { spaceAfter: 10 }),
 
        // DIEU 4
        ...artHeading(T.art4, T.art4B),
        ...bi(clause("art4_1_vi", T.art4_1), clauseB("art4_1_b", T.art4_1B), { spaceAfter: 2 }),
        ...bi(clause("art4_2_vi", T.art4_2), clauseB("art4_2_b", T.art4_2B), { spaceAfter: 2 }),
        ...bi(clause("art4_3_vi", T.art4_3), clauseB("art4_3_b", T.art4_3B), { spaceAfter: 2 }),
        ...bi(clause("art4_4_vi", T.art4_4), clauseB("art4_4_b", T.art4_4B), { spaceAfter: 10 }),
 
        // DIEU 5
        ...artHeading(T.art5, T.art5B),
        ...bi(clause("art5_vi", T.art5_body), clauseB("art5_b", T.art5_bodyB), { spaceAfter: 10 }),
 
        // DIEU 6
        ...artHeading(T.art6, T.art6B),
        ...bi("6.1 " + clause("art6_1_vi", T.art6_1), "6.1 " + clauseB("art6_1_b", T.art6_1B), { spaceAfter: 2 }),
        ...bi("6.2 " + clause("art6_2_vi", T.art6_2), "6.2 " + clauseB("art6_2_b", T.art6_2B), { spaceAfter: 2 }),
        ...bi("6.3 " + clause("art6_3_vi", T.art6_3), "6.3 " + clauseB("art6_3_b", T.art6_3B), { spaceAfter: 2 }),
        ...bi("6.4 " + clause("art6_4_vi", T.art6_4), "6.4 " + clauseB("art6_4_b", T.art6_4B), { spaceAfter: 2 }),
        ...bi("6.5 " + clause("art6_5_vi", T.art6_5), "6.5 " + clauseB("art6_5_b", T.art6_5B), { spaceAfter: 16 }),
 
        // Chu ky
        signTable,
      ],
    };
 
    const filename = "HopDong_" + (form.contractNumber || quote.quoteNumber) + ".pdf";
    window.pdfMake.createPdf(docDefinition).download(filename);
 
  } catch(e) {
    alert("Loi xuat PDF: " + e.message);
    console.error(e);
  } finally {
    setPdfLoadingC(false);
  }
};

            <p style={{margin:"2px 0 14px",fontStyle:"italic",color:"#555"}}>{clauseB("art5_b",T.art5_bodyB)}</p>

            <div style={{fontWeight:700,margin:"12px 0 2px",textTransform:"uppercase"}}>{T.art6}</div>
            <div style={{fontStyle:"italic",color:"#555",marginBottom:8}}>{T.art6B}</div>
            <p style={{margin:"4px 0"}}>6.1 {clause("art6_1_vi",T.art6_1)}</p>
            <p style={{margin:"2px 0",fontStyle:"italic",color:"#555"}}>6.1 {clauseB("art6_1_b",T.art6_1B)}</p>
            <p style={{margin:"4px 0"}}>6.2 {clause("art6_2_vi",T.art6_2)}</p>
            <p style={{margin:"2px 0",fontStyle:"italic",color:"#555"}}>6.2 {clauseB("art6_2_b",T.art6_2B)}</p>
            <p style={{margin:"4px 0"}}>6.3 {clause("art6_3_vi",T.art6_3)}</p>
            <p style={{margin:"2px 0",fontStyle:"italic",color:"#555"}}>6.3 {clauseB("art6_3_b",T.art6_3B)}</p>
            <p style={{margin:"4px 0"}}>6.4 {clause("art6_4_vi",T.art6_4)}</p>
            <p style={{margin:"2px 0",fontStyle:"italic",color:"#555"}}>6.4 {clauseB("art6_4_b",T.art6_4B)}</p>
            <p style={{margin:"4px 0"}}>6.5 {clause("art6_5_vi",T.art6_5)}</p>
            <p style={{margin:"2px 0 24px",fontStyle:"italic",color:"#555"}}>6.5 {clauseB("art6_5_b",T.art6_5B)}</p>

            <div style={{display:"flex",justifyContent:"space-between",marginTop:24}}>
              <div style={{textAlign:"center",width:"45%"}}>
                <div style={{fontWeight:700}}>{T.signSeller}</div>
                <div style={{fontStyle:"italic",color:"#555",fontSize:`${fontSize*0.85}pt`,marginBottom:60}}>{T.signSellerB}</div>
                <div style={{fontWeight:700}}>{COMPANY.representative}</div>
              </div>
              <div style={{textAlign:"center",width:"45%"}}>
                <div style={{fontWeight:700}}>{T.signBuyer}</div>
                <div style={{fontStyle:"italic",color:"#555",fontSize:`${fontSize*0.85}pt`,marginBottom:60}}>{T.signBuyerB}</div>
                <div style={{fontWeight:700}}>{form.buyerRep}</div>
              </div>
            </div>
          </div>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Đóng</button>
          <button className="btn btn-ghost" onClick={handleSave}>💾 Lưu hợp đồng {saveMsg && <span style={{color:"#16a34a",marginLeft:6}}>{saveMsg}</span>}</button>
          <button className="btn btn-ghost" onClick={handlePDFClick} disabled={pdfLoadingC} style={{minWidth:120}}>
            {pdfLoadingC ? "⏳ Đang tạo..." : "📄 Xuất PDF"}
          </button>
          <button className="btn btn-primary" onClick={handleWordClick} disabled={wordLoading} style={{minWidth:120}}>
            {wordLoading ? "⏳ Đang tạo..." : "📝 Xuất Word"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
// PHẦN 9 – ỨNG DỤNG CHÍNH (App)
// ═══════════════════════════════════════════════════════════════════════════════
// Quản lý state toàn cục: quotes, modal đang mở, tìm kiếm, xác nhận xóa...
// Render: Topbar → Sidebar → Content (Dashboard / Danh sách báo giá / Catalog)
function App() {

  const [quotes, setQuotes] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [authed, setAuthed] = useState(() => isAuthenticated());

  const [view, setView] = useState("list");
  const [showModal, setShowModal] = useState(false);
  const [editQuote, setEditQuote] = useState(null);
  const [printQuote, setPrintQuote] = useState(null);
  const [contractQuote, setContractQuote] = useState(null);
  const [handoverQuote, setHandoverQuote] = useState(null);
  const [showNewHandover, setShowNewHandover] = useState(false);
  const [deliveryQuote, setDeliveryQuote] = useState(null);
  const [search, setSearch] = useState("");
  const [itemSearch, setItemSearch] = useState("");
  const [filterStatus, setFilterStatus] = useState("all");
  const [deleteConfirm, setDeleteConfirm] = useState(null);

  // ── Khởi động: load từ GAS (hoặc cache nếu offline) ──────────────────────
  useEffect(() => {
    if (!authed) return; // chưa đăng nhập → không load
    (async () => {
      try {
        await migrateFromLocalStorage();
        const data = await doLoad();
        setQuotes(data ?? []);
        if (_mem.products.length === 0 && data && data.length) {
          await upsertCatalogItems(data.flatMap(q => q.items || []));
        }
      } catch(e) {
        console.error("Load error:", e);
        setQuotes([]);
      } finally {
        setLoaded(true);
      }
    })();
  }, [authed]);

  // ── Tự động lưu mỗi khi quotes thay đổi (debounce) ───────────────────────
  useEffect(() => {
    if (!loaded) return;
    saveQuotes(quotes);
  }, [quotes, loaded]);

  const saveQuote = (q) => {
    setQuotes(prev => {
      const idx = prev.findIndex(x=>x.id===q.id);
      if (idx>=0) { const n=[...prev]; n[idx]=q; return n; }
      return [q,...prev];
    });
    setShowModal(false);
    setEditQuote(null);
  };

  const deleteQuote = (id) => {
    setQuotes(prev=>prev.filter(q=>q.id!==id));
    setDeleteConfirm(null);
  };

  // Filter list: search by quote number, customer, OR item name
  const filtered = quotes.filter(q => {
    const matchStatus = filterStatus==="all" || q.status===filterStatus;
    if (!matchStatus) return false;
    if (!search && !itemSearch) return true;
    const s = search.toLowerCase();
    const iS = itemSearch.toLowerCase();
    const matchMain = !s || q.quoteNumber.toLowerCase().includes(s) || q.customer.toLowerCase().includes(s);
    const matchItem = !iS || q.items.some(it => it.name.toLowerCase().includes(iS) || (it.note||"").toLowerCase().includes(iS));
    return matchMain && matchItem;
  }).slice().sort((a, b) => {
    const hasA = !!(a.quoteNumber && a.quoteNumber.trim());
    const hasB = !!(b.quoteNumber && b.quoteNumber.trim());
    // No-number quotes go to bottom
    if (hasA && !hasB) return -1;
    if (!hasA && hasB) return 1;
    if (!hasA && !hasB) return 0;
    // Both have numbers — sort newest first by extracting date digits from quoteNumber (DDMMYY format)
    // Format: BG{DD}{MM}{YY}{counter} e.g. BG13062603 → 13/06/2026
    const extractDate = (qn) => {
      const m = qn.replace(/^[A-Za-z]+/, "");
      if (m.length >= 6) {
        const day = m.slice(0,2), mon = m.slice(2,4), yr = m.slice(4,6);
        return `20${yr}${mon}${day}`;
      }
      return qn;
    };
    const da = extractDate(a.quoteNumber);
    const db2 = extractDate(b.quoteNumber);
    if (da !== db2) return db2.localeCompare(da); // newest first
    // Same date — sort by counter descending
    return b.quoteNumber.localeCompare(a.quoteNumber);
  });

  const stats = {
    total: quotes.length,
    draft: quotes.filter(q=>q.status==="draft").length,
    sent: quotes.filter(q=>q.status==="sent").length,
    accepted: quotes.filter(q=>q.status==="accepted").length,
    totalValue: quotes.reduce((s,q)=>s+calcItems(q.items,q.vatRate).total,0),
    acceptedValue: quotes.filter(q=>q.status==="accepted").reduce((s,q)=>s+calcItems(q.items,q.vatRate).total,0),
  };

  // ── Guard: chưa đăng nhập → hiện LoginScreen ─────────────────────────────
  if (!authed) {
    return <LoginScreen onLogin={() => setAuthed(true)} />;
  }

  // ── Guard: đang load dữ liệu ─────────────────────────────────────────────
  if (!loaded) {
    return (
      <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"#f5f3ee", flexDirection:"column", gap:12 }}>
        <img src={LOGO_DATA_URL} style={{ width:48, opacity:0.5 }} alt="PMC" />
        <div style={{ color:"#888", fontSize:13 }}>Đang tải dữ liệu...</div>
      </div>
    );
  }

  return (
    <div className="app">
      <div className="topbar no-print">
        <div className="topbar-brand">
          <img src={LOGO_DATA_URL} alt="PMC" />
          <span>Quản Lý Báo Giá – {COMPANY.short}</span>
        </div>
        <div className="topbar-actions">
          <button
            className="btn btn-ghost"
            title="Xuất toàn bộ dữ liệu ra file .json để backup hoặc chuyển máy"
            style={{color:"#fff",border:"1px solid rgba(255,255,255,0.3)",fontSize:12}}
            onClick={() => exportToJSON()}
          >
            📤 Xuất JSON
          </button>
          <button
            className="btn btn-ghost"
            title="Nhập dữ liệu từ file .json (ghi đè dữ liệu hiện tại)"
            style={{color:"#adc",border:"1px solid rgba(255,255,255,0.2)",fontSize:12}}
            onClick={() => importFromJSON((newQuotes) => setQuotes(newQuotes))}
          >
            📂 Nhập JSON
          </button>
          <button
            className="btn btn-ghost"
            title="Đăng xuất"
            style={{color:"#f99",border:"1px solid rgba(255,255,255,0.2)",fontSize:12}}
            onClick={logout}
          >
            🔒 Đăng xuất
          </button>
          <button className="btn btn-primary" onClick={()=>{setEditQuote(null);setShowModal(true);}}>
            + Tạo báo giá
          </button>
        </div>
      </div>

      <div className="main">
        <div className="sidebar no-print">
          <div className="sidebar-section">Menu</div>
          <div className={`sidebar-item ${view==="dashboard"?"active":""}`} onClick={()=>setView("dashboard")}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            Dashboard
          </div>
          <div className={`sidebar-item ${view==="list"?"active":""}`} onClick={()=>setView("list")}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
            Danh sách báo giá
            <span className="sidebar-badge">{quotes.length}</span>
          </div>
          <div className={`sidebar-item ${view==="handover"?"active":""}`} onClick={()=>setView("handover")}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 4.97-4.03 9-9 9S3 16.97 3 12 7.03 3 12 3s9 4.03 9 9z"/></svg>
            Biên bản bàn giao
          </div>

          <div className="sidebar-section">Trạng thái</div>
          {Object.entries(STATUS_LABELS).map(([k,v])=>(
            <div key={k} className={`sidebar-item ${filterStatus===k&&view==="list"?"active":""}`}
              onClick={()=>{setFilterStatus(k);setView("list");}}>
              <span style={{width:8,height:8,borderRadius:"50%",background:{draft:"#9ca3af",sent:"#3b82f6",accepted:"#22c55e",rejected:"#ef4444"}[k],display:"inline-block"}}/>
              {v}
              <span style={{marginLeft:"auto",fontSize:11,color:"#aaa"}}>{quotes.filter(q=>q.status===k).length}</span>
            </div>
          ))}
          <div className={`sidebar-item ${filterStatus==="all"&&view==="list"?"active":""}`}
            onClick={()=>{setFilterStatus("all");setView("list");}}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/></svg>
            Tất cả
          </div>
        </div>

        <div className="content">
          {view === "dashboard" && (
            <div>
              <div style={{marginBottom:20}}>
                <h2 style={{fontSize:18,fontWeight:600,color:"#1a2540",marginBottom:4}}>Dashboard</h2>
                <p style={{color:"#888",fontSize:13}}>Tổng quan hoạt động báo giá</p>
              </div>
              <div className="stats-grid">
                <div className="stat-card">
                  <div className="stat-label">Tổng báo giá</div>
                  <div className="stat-value">{stats.total}</div>
                  <div className="stat-sub">Tất cả trạng thái</div>
                </div>
                <div className="stat-card">
                  <div className="stat-label">Chờ phản hồi</div>
                  <div className="stat-value" style={{color:"#2563eb"}}>{stats.sent}</div>
                  <div className="stat-sub">Đã gửi khách</div>
                </div>
                <div className="stat-card">
                  <div className="stat-label">Chấp nhận</div>
                  <div className="stat-value" style={{color:"#16a34a"}}>{stats.accepted}</div>
                  <div className="stat-sub">Đơn thành công</div>
                </div>
                <div className="stat-card">
                  <div className="stat-label">Doanh số chấp nhận</div>
                  <div className="stat-value" style={{fontSize:16}}>{fmt(stats.acceptedValue)}đ</div>
                  <div className="stat-sub">Có VAT</div>
                </div>
              </div>
              <div className="card">
                <div className="card-header">
                  <span style={{fontWeight:500}}>Báo giá gần đây</span>
                  <button className="btn btn-ghost btn-sm" onClick={()=>setView("list")}>Xem tất cả →</button>
                </div>
                <div className="table-wrap">
                  <table>
                    <thead><tr><th>Số BG</th><th>Khách hàng</th><th>Ngày</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead>
                    <tbody>
                      {quotes.slice(0,5).map(q=>{
                        const {total}=calcItems(q.items,q.vatRate);
                        return (
                          <tr key={q.id} style={{cursor:"pointer"}} onClick={()=>{setEditQuote(q);setShowModal(true);}}>
                            <td style={{fontWeight:500,color:"#1a2540"}}>{q.quoteNumber}</td>
                            <td>{q.customer}</td>
                            <td style={{color:"#888"}}>{q.date}</td>
                            <td style={{fontWeight:500}}>{fmt(total)} đ</td>
                            <td><span className={`badge badge-${q.status}`}>{STATUS_LABELS[q.status]}</span></td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {view === "handover" && (
            <div>
              <div style={{marginBottom:20,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div>
                  <h2 style={{fontSize:18,fontWeight:600,color:"#1a2540",marginBottom:4}}>Biên bản bàn giao & nghiệm thu</h2>
                  <p style={{color:"#888",fontSize:13}}>Tạo biên bản từ báo giá đã có hoặc tạo mới độc lập</p>
                </div>
                <button className="btn btn-primary" onClick={()=>setShowNewHandover(true)}>+ Tạo biên bản mới</button>
              </div>
              <div className="card">
                <div style={{padding:"16px 20px",borderBottom:"1px solid #e5e3dc"}}>
                  <div style={{fontSize:13,color:"#555",fontWeight:500}}>Tạo biên bản từ báo giá có sẵn</div>
                  <div style={{fontSize:12,color:"#aaa",marginTop:3}}>Chọn một báo giá bên dưới để tạo biên bản bàn giao & nghiệm thu từ danh sách hàng hóa đã có</div>
                </div>
                <div className="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Số BG</th>
                        <th>Khách hàng</th>
                        <th>Ngày</th>
                        <th style={{textAlign:"center"}}>Hàng hóa</th>
                        <th style={{textAlign:"right"}}>Tổng tiền</th>
                        <th style={{textAlign:"center"}}>Thao tác</th>
                      </tr>
                    </thead>
                    <tbody>
                      {quotes.map(q=>{
                        const {total}=calcItems(q.items,q.vatRate);
                        return (
                          <tr key={q.id}>
                            <td style={{fontWeight:500,color:"#1a2540"}}>{q.quoteNumber}</td>
                            <td>{q.customer}</td>
                            <td style={{color:"#888",whiteSpace:"nowrap"}}>{q.date}</td>
                            <td style={{textAlign:"center",color:"#888"}}>{q.items.length} dòng</td>
                            <td style={{textAlign:"right",fontWeight:500}}>{fmt(total)} đ</td>
                            <td>
                              <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                                <button className="btn btn-primary btn-sm" onClick={()=>setHandoverQuote(q)}>
                                  📋 Tạo biên bản
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {view === "list" && (            <div>
              <div style={{marginBottom:20}}>
                <h2 style={{fontSize:18,fontWeight:600,color:"#1a2540",marginBottom:4}}>Danh sách báo giá</h2>
                <p style={{color:"#888",fontSize:13}}>{filtered.length} báo giá {filterStatus!=="all"?`– ${STATUS_LABELS[filterStatus]}`:""}</p>
              </div>
              <div className="filter-bar">
                <input className="search-input" placeholder="🔍 Tìm số BG hoặc khách hàng..." value={search} onChange={e=>setSearch(e.target.value)} />
                <input className="search-input" style={{width:240}} placeholder="📦 Tìm tên hàng hóa..." value={itemSearch} onChange={e=>setItemSearch(e.target.value)} />
                <select className="form-control" style={{width:"auto"}} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
                  <option value="all">Tất cả trạng thái</option>
                  {Object.entries(STATUS_LABELS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
                </select>
                <button className="btn btn-primary" onClick={()=>{setEditQuote(null);setShowModal(true);}}>+ Tạo báo giá</button>
              </div>
              <div className="card">
                {filtered.length===0?(
                  <div className="empty-state">
                    <div style={{fontSize:40}}>📄</div>
                    <h3>Không tìm thấy báo giá</h3>
                    <p style={{fontSize:13}}>{search||itemSearch ? "Thử thay đổi từ khóa tìm kiếm" : "Tạo báo giá mới để bắt đầu"}</p>
                    {!search&&!itemSearch&&<button className="btn btn-primary" style={{marginTop:12}} onClick={()=>{setEditQuote(null);setShowModal(true);}}>+ Tạo báo giá đầu tiên</button>}
                  </div>
                ):(
                  <div className="table-wrap">
                    <table>
                      <thead>
                        <tr>
                          <th>Số BG</th>
                          <th>Khách hàng</th>
                          <th>Ngày</th>
                          <th>Hàng hóa</th>
                          <th style={{textAlign:"right"}}>Tổng tiền</th>
                          <th>Trạng thái</th>
                          <th style={{textAlign:"center"}}>Thao tác</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filtered.map(q=>{
                          const {total}=calcItems(q.items,q.vatRate);
                          // Highlight matched items if searching
                          const matchedItems = itemSearch ? q.items.filter(it => it.name.toLowerCase().includes(itemSearch.toLowerCase())) : [];
                          return (
                            <tr key={q.id}>
                              <td style={{fontWeight:500,color:"#1a2540"}}>{q.quoteNumber}</td>
                              <td>
                                <div style={{fontWeight:500}}>{q.customer}</div>
                                {q.contact&&<div style={{fontSize:11,color:"#aaa"}}>{q.contact}</div>}
                                {matchedItems.length>0&&(
                                  <div style={{fontSize:10,color:"#1a2540",background:"#eef0f8",padding:"2px 5px",borderRadius:3,marginTop:3,display:"inline-block"}}>
                                    📦 {matchedItems.map(i=>i.name).join(", ").substring(0,60)}
                                  </div>
                                )}
                              </td>
                              <td style={{color:"#888",whiteSpace:"nowrap"}}>{q.date}</td>
                              <td style={{textAlign:"center",color:"#888"}}>{q.items.length} dòng</td>
                              <td style={{textAlign:"right",fontWeight:500}}>{fmt(total)} đ</td>
                              <td>
                                <select className="badge" style={{border:"1px solid #e5e3dc",background:"none",cursor:"pointer",fontSize:11,padding:"3px 6px",borderRadius:4}}
                                  value={q.status}
                                  onChange={e=>setQuotes(prev=>prev.map(x=>x.id===q.id?{...x,status:e.target.value}:x))}>
                                  {Object.entries(STATUS_LABELS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
                                </select>
                              </td>
                              <td>
                                <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                                  <button className="btn btn-ghost btn-sm btn-icon" title="Xem & In / Xuất" onClick={()=>setPrintQuote(q)}>🖨️</button>
                                  <button className="btn btn-ghost btn-sm btn-icon" title="Chỉnh sửa" onClick={()=>{setEditQuote(q);setShowModal(true);}}>✏️</button>
                                  <button className="btn btn-ghost btn-sm btn-icon" title="Nhân bản" onClick={()=>{
                                    const copy={...JSON.parse(JSON.stringify(q)),id:generateId(),quoteNumber:generateQuoteNumber([...quotes,q]),date:todayStr(),status:"draft"};
                                    setQuotes(prev=>[copy,...prev]);
                                  }}>⧉</button>
                                  <button
                                    className="btn btn-ghost btn-sm btn-icon"
                                    title="Xóa (giữ Shift + click)"
                                    style={{color:"#dc2626",opacity:0.5,transition:"opacity 0.15s"}}
                                    onMouseEnter={e=>e.currentTarget.style.opacity="1"}
                                    onMouseLeave={e=>e.currentTarget.style.opacity="0.5"}
                                    onClick={(e)=>{
                                      if (!e.shiftKey) {
                                        showToast("⚠️ Giữ phím Shift rồi click để xóa", 2000);
                                        return;
                                      }
                                      setDeleteConfirm(q.id);
                                    }}
                                  >🗑️</button>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      </div>

      {showModal && (
        <QuoteModal
          quote={editQuote}
          allQuotes={quotes}
          onSave={saveQuote}
          onClose={()=>{setShowModal(false);setEditQuote(null);}}
        />
      )}

      {printQuote && (
        <PrintModal
          quote={printQuote}
          onClose={()=>setPrintQuote(null)}
          onCreateContract={(q)=>{setPrintQuote(null);setContractQuote(q);}}
          onHandover={(q)=>{setPrintQuote(null);setHandoverQuote(q);}}
          onDelivery={(q)=>{setPrintQuote(null);setDeliveryQuote(q);}}
        />
      )}

      {contractQuote && (
        <ContractModal
          quote={contractQuote}
          onClose={()=>setContractQuote(null)}
        />
      )}

      {handoverQuote && (
        <HandoverModal
          quote={handoverQuote}
          onClose={()=>setHandoverQuote(null)}
        />
      )}

      {showNewHandover && (
        <HandoverModal
          quote={null}
          onClose={()=>setShowNewHandover(false)}
        />
      )}

      {deliveryQuote && (
        <DeliveryModal
          quote={deliveryQuote}
          onClose={()=>setDeliveryQuote(null)}
        />
      )}

      {deleteConfirm && (
        <div className="modal-overlay" onClick={()=>setDeleteConfirm(null)}>
          <div className="modal" style={{maxWidth:380}} onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <span className="modal-title">🗑️ Xác nhận xóa</span>
              <button className="close-btn" onClick={()=>setDeleteConfirm(null)}>×</button>
            </div>
            <div className="modal-body">
              <p style={{fontSize:14,color:"#555",lineHeight:1.7}}>Bạn đang xóa báo giá <b>{quotes.find(q=>q.id===deleteConfirm)?.quoteNumber}</b>.<br/>Hành động này <b style={{color:"#dc2626"}}>không thể hoàn tác</b>.</p>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setDeleteConfirm(null)}>Hủy</button>
              <button className="btn btn-danger" onClick={()=>deleteQuote(deleteConfirm)}>Xóa vĩnh viễn</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
